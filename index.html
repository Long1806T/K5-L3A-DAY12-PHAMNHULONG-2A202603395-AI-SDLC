<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng</title>
<link rel="icon" href="data:,">
<style>
  /* Standard palette (Ticket-02): UI text #F5F1E6, danger #FF5A5F, gold #F2C14E */
  :root { --text: #F5F1E6; --danger: #FF5A5F; --gold: #F2C14E; --warm: #FFB347; --sky: #0E1430; --rim: #7A3CFF; --ui-scale: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--text);
    font: calc(18px * var(--ui-scale))/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 3px #000c; }
  .tl, .tc, .tr, .bc, .br { position: absolute; display: flex; gap: 10px; align-items: center; }
  .tl { top: 14px; left: 16px; }
  .tc { top: 10px; left: 50%; transform: translateX(-50%); }
  .tr { top: 14px; right: 16px; }
  .bc { bottom: 18px; left: 50%; transform: translateX(-50%); flex-direction: column; gap: 8px; }
  .br { bottom: 18px; right: 18px; }
  .flame svg { width: 30px; height: 30px; fill: var(--warm); filter: drop-shadow(0 0 6px #ffb347aa); }
  .flame.off svg { fill: #3a3346; filter: none; }
  #clock { font-size: calc(30px * var(--ui-scale)); font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .danger { color: var(--danger); }
  body.cb { --danger: #FFFFFF; --rim: #00B3FF; } /* colour-blind palette (Ticket-03) */
  .lan-count small { font-size: 15px; opacity: .8; }
  .lan-count.short small { color: var(--danger); opacity: 1; }
  .fuel { position: absolute; transform: translate(-50%, -100%); width: 60px; height: 9px; border-radius: 5px; background: #0009; border: 1px solid #ffffff55; }
  .fuel i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffb347, #ffe9b0); }
  .fuel span { position: absolute; left: 50%; top: -20px; transform: translateX(-50%); font-size: 13px; white-space: nowrap; }
  .fuel.low { border-color: var(--danger); animation: blink 1s steps(2, start) infinite; } /* 1 Hz */
  .fuel.low i { background: var(--danger); }
  .fuel.low span { color: var(--danger); }
  .blink { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  #lanterns { display: flex; gap: 14px; align-items: center; font-size: calc(20px * var(--ui-scale)); }
  #lanterns .score { color: var(--gold); font-weight: 700; }
  #motebar { display: flex; gap: 4px; align-items: center; padding: 6px 10px; border-radius: 14px; background: #0008; }
  .slot { width: 16px; height: 16px; border-radius: 50%; background: #2c2738; border: 1px solid #4a4058; }
  .slot.on { background: #FFF6C2; box-shadow: 0 0 9px #FFE58A; border-color: #FFE58A; }
  #motebar b { margin-left: 8px; }
  #prompt { padding: 6px 14px; border-radius: 14px; background: #000b; }
  #prompt:empty { display: none; }
  #cds { display: flex; gap: 12px; }
  .cd { width: 64px; height: 64px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: conic-gradient(#f2c14e99 calc(var(--p) * 360deg), #0009 0); border: 2px solid #ffffff22; opacity: .75; }
  .cd.ready { opacity: 1; border-color: var(--gold); box-shadow: 0 0 12px #f2c14e66; }
  .cd i { font-style: normal; font-size: calc(20px * var(--ui-scale)); }
  .cd small { font-size: 12px; }
  kbd { padding: 1px 6px; border-radius: 4px; background: #ffffff1f; border: 1px solid #ffffff33; font: 15px ui-monospace, monospace; }
  #toast { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); padding: 7px 18px; border-radius: 16px;
    background: #140c22dd; border: 1px solid #ffb34755; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #arrow { position: absolute; width: 0; height: 0; display: none; }
  #arrow.show { display: block; }
  #arrow::after { content: ''; position: absolute; left: -14px; top: -14px; width: 0; height: 0;
    border-top: 14px solid transparent; border-bottom: 14px solid transparent; border-left: 28px solid var(--warm); filter: drop-shadow(0 0 6px #ffb347); }
  #seed, #fps { position: absolute; bottom: 6px; left: 12px; font-size: 13px; opacity: .5; }
  #fps { left: auto; right: 12px; top: 6px; bottom: auto; opacity: .8; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #flash.on { animation: flash .5s ease-out; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #07041099; }
  #overlay.show { display: flex; }
  .panel { max-width: 620px; max-height: 94vh; overflow: auto; margin: 16px; padding: 26px 32px; border-radius: 18px; background: #120c22f0;
    border: 1px solid #f2c14e44; box-shadow: 0 0 40px #ffb34722; text-align: center; }
  .panel h1 { margin: 0 0 6px; font-size: calc(38px * var(--ui-scale)); color: var(--warm); }
  .panel h1.lost { color: #b48cff; }
  .panel h1.dawn { color: #ffd89a; text-shadow: 0 0 24px #ffb347; }
  .panel .sub { margin: 0 0 10px; opacity: .85; }
  .panel .big { font-size: calc(30px * var(--ui-scale)); font-weight: 700; color: var(--gold); margin: 8px 0; }
  .panel .small { font-size: 16px; opacity: .85; }
  .gold { color: var(--gold); }
  .story { margin: 12px 0; padding: 12px 16px; border-radius: 12px; background: #ffffff0d; text-align: left; font-style: italic; }
  .menu { display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 14px 0; }
  .menu .row { display: flex; gap: 8px; }
  .keys { margin: 12px auto; border-collapse: collapse; text-align: left; font-size: 16px; }
  .keys td { padding: 3px 8px; }
  .field { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin: 10px 0; text-align: left; }
  .field input[type=range] { flex: 1; }
  button { padding: 10px 24px; border-radius: 22px; border: 0; cursor: pointer; font: inherit; font-weight: 700; min-width: 220px;
    background: linear-gradient(#ffc06e, #ff9a3d); color: #2a1406; box-shadow: 0 0 18px #ff8a3d55; }
  button.ghost { background: #ffffff14; color: var(--text); box-shadow: none; border: 1px solid #ffffff33; min-width: 0; }
  .menu > button.ghost { min-width: 220px; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div class="tl"><div id="flames"></div></div>
  <div class="tc"><div id="clock"></div></div>
  <div class="tr"><div id="lanterns"></div></div>
  <div class="bc"><div id="prompt"></div><div id="motebar"></div></div>
  <div class="br"><div id="cds"></div></div>
  <div id="fuelbars"></div>
  <div id="arrow"></div>
  <div id="toast"></div>
  <div id="seed"></div>
  <div id="fps"></div>
</div>
<div id="flash"></div>
<div id="overlay"></div>
<noscript>Game cần JavaScript và WebGL.</noscript>
<script type="module" src="src/web/main.js"></script>
</body>
</html>
