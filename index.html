<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng</title>
<link rel="icon" href="data:,">
<style>
  :root { --warm: #ffb15c; --warm2: #ff8a3d; --ink: #b48cff; --text: #f6eadb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0918; color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 3px #000a; }
  .tl, .tc, .tr, .bl, .bc { position: absolute; display: flex; gap: 10px; align-items: center; }
  .tl { top: 14px; left: 16px; flex-direction: column; align-items: flex-start; }
  .tc { top: 12px; left: 50%; transform: translateX(-50%); flex-direction: column; gap: 0; }
  .tr { top: 14px; right: 16px; }
  .bl { bottom: 16px; left: 16px; }
  .bc { bottom: 54px; left: 50%; transform: translateX(-50%); }
  #flames { display: flex; gap: 4px; }
  .flame svg { width: 26px; height: 26px; fill: var(--warm2); filter: drop-shadow(0 0 6px #ff8a3daa); }
  .flame.off svg { fill: #3a3346; filter: none; }
  #carried { display: flex; gap: 4px; align-items: center; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #2c2738; border: 1px solid #4a4058; }
  .dot.on { background: #ffe27a; box-shadow: 0 0 8px #ffd34d; border-color: #ffe9a0; }
  #carried b, #lanterns b { margin-left: 6px; font-weight: 600; }
  #time { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  #time .warn { color: #ff9b7a; }
  #score { font-size: 14px; opacity: .85; }
  #lanterns { display: flex; gap: 6px; align-items: center; }
  .lan { display: inline-flex; flex-direction: column; align-items: center; font-size: 10px; opacity: .8; }
  .lan i { width: 16px; height: 20px; border-radius: 8px; border: 1px solid #6b4a3a; display: block;
    background: linear-gradient(to top, #ff9a3d calc(var(--fill) * 100%), #2a2030 calc(var(--fill) * 100%)); }
  .lan.lit i { background: #ffb24d; box-shadow: 0 0 10px #ff9a3d; border-color: #ffd29a; }
  #pulse span { padding: 4px 10px; border-radius: 12px; background: #0008; font-size: 13px; opacity: .7; }
  #pulse span.ready { opacity: 1; color: #ffe2a8; box-shadow: 0 0 10px #ffb15c66; }
  #hint { padding: 6px 14px; border-radius: 14px; background: #000a; font-size: 14px; }
  #hint:empty { display: none; }
  kbd { padding: 1px 6px; border-radius: 4px; background: #ffffff1f; border: 1px solid #ffffff33; font: 12px ui-monospace, monospace; }
  #toast { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); padding: 6px 16px; border-radius: 16px;
    background: #1a1024cc; border: 1px solid #ffb15c55; opacity: 0; transition: opacity .25s; }
  #toast.show { opacity: 1; }
  #seed { position: absolute; bottom: 8px; right: 12px; font-size: 11px; opacity: .45; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #flash.on { animation: flash .5s ease-out; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #07040f99; }
  #overlay.show { display: flex; }
  .panel { max-width: 560px; margin: 16px; padding: 26px 30px; border-radius: 18px; background: #160e22ee;
    border: 1px solid #ffb15c40; box-shadow: 0 0 40px #ff8a3d22; text-align: center; }
  .panel h1 { margin: 0 0 4px; font-size: 34px; color: var(--warm); letter-spacing: .5px; }
  .panel h1.lost { color: var(--ink); }
  .panel .sub { margin: 0 0 12px; opacity: .8; }
  .panel .big { font-size: 28px; font-weight: 700; color: #ffe2a8; margin: 8px 0; }
  .panel .small { font-size: 13px; opacity: .8; }
  .ink { color: var(--ink); font-weight: 600; }
  .keys { margin: 14px auto; border-collapse: collapse; text-align: left; font-size: 14px; }
  .keys td { padding: 3px 8px; }
  button { margin-top: 10px; padding: 10px 22px; border-radius: 22px; border: 0; cursor: pointer; font: inherit; font-weight: 700;
    background: linear-gradient(#ffc06e, #ff8a3d); color: #2a1406; box-shadow: 0 0 18px #ff8a3d66; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div class="tl"><div id="flames"></div><div id="carried"></div></div>
  <div class="tc"><div id="time"></div><div id="score"></div></div>
  <div class="tr"><div id="lanterns"></div></div>
  <div class="bl" id="pulse"></div>
  <div class="bc" id="hint"></div>
  <div id="toast"></div>
  <div id="seed"></div>
</div>
<div id="flash"></div>
<div id="overlay"></div>
<noscript>Game cần JavaScript và WebGL.</noscript>
<script type="module" src="src/web/main.js"></script>
</body>
</html>
