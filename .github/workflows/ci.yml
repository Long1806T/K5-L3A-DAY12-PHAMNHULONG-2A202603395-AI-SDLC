name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: sh scripts/verify.sh
      - name: determinism (same seed twice)
        run: |
          node src/headless.js --seed 7 --night 1 --ticks 3600 --out a.jsonl
          node src/headless.js --seed 7 --night 1 --ticks 3600 --out b.jsonl
          cmp a.jsonl b.jsonl
